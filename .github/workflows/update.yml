name: Update stock dashboard

on:
  schedule:
    - cron: '2 23 * * *'   # 07:02 Asia/Taipei
    - cron: '31 8 * * *'   # 16:31 Asia/Taipei
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pandas numpy

      - name: Fetch data and compute signals
        run: python fetch_analyze.py

      - name: Build dashboard page
        run: python splice.py

      - name: Fetch live quotes (no-op outside market hours)
        run: python live_quotes.py

      - name: Include live quotes in the deployed page
        run: cp live_quotes.json dist/live_quotes.json

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis_output.json recommendations.json factor_accuracy.json prediction_accuracy.json baseline_accuracy.json predictions.json baseline_predictions.json alerts.json prev_state.json
          git diff --cached --quiet || git commit -m "Auto-update dashboard data [skip ci]"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
